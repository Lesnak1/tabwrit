[package]
name = "tab-vault"
version = "0.1.0"
edition = "2021"
authors = ["Tab Protocol Team"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.29.1", features = ["legacy", "unit-testing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
