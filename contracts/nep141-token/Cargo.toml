[package]
name = "nep141-token"
version = "0.1.0"
edition = "2021"
authors = ["Tab Protocol Team"]
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.29.1", features = ["legacy"] }
near-contract-standards = "5.29.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
